<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rio • كاشف تيك توك</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0b10; --card:#14141c; --card2:#1c1c26; --line:rgba(255,255,255,.08);
  --txt:#f5f5f7; --mut:#9a9aad;
  --pink:#fe2c55; --cyan:#25f4ee; --grad:linear-gradient(135deg,#fe2c55,#ff6b4a 55%,#25f4ee);
}
html,body{min-height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:var(--bg); color:var(--txt);
  display:flex; justify-content:center; padding:0 0 40px;
  background-image:radial-gradient(600px 300px at 85% -50px,rgba(254,44,85,.14),transparent),
                   radial-gradient(600px 300px at 10% 0px,rgba(37,244,238,.08),transparent);
  background-attachment:fixed;
}
.app{width:100%;max-width:480px;padding:18px 16px}
/* ===== header ===== */
.hdr{text-align:center;padding:26px 0 18px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo .mk{width:46px;height:46px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 6px 24px rgba(254,44,85,.4)}
.logo h1{font-size:30px;font-weight:900;letter-spacing:.5px}
.tag{color:var(--mut);font-size:13px;margin-top:6px}
.tag b{color:var(--cyan)}
/* ===== search ===== */
.search{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.srow{display:flex;gap:8px}
.srow input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--txt);
  padding:13px 14px;font-size:15px;outline:none;min-width:0}
.srow input:focus{border-color:var(--pink)}
.btn{border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:15px;padding:0 18px;
  display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(254,44,85,.35)}
.btn-g{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.hint{color:var(--mut);font-size:12px;margin-top:9px;text-align:center}
/* history */
.hist{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;cursor:pointer;color:var(--txt)}
.hchip img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#333}
.hchip .x{color:var(--mut);font-size:15px;padding:0 2px}
.hchip .x:hover{color:var(--pink)}
.hist-title{font-size:12px;color:var(--mut);margin:10px 2px 0;display:flex;justify-content:space-between;align-items:center}
.hist-title button{background:none;border:none;color:var(--pink);font-size:12px;cursor:pointer}
/* ===== loader (skeleton) ===== */
.skel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--card2) 25%,#262633 50%,var(--card2) 75%);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* ===== error ===== */
.err{background:rgba(254,44,85,.08);border:1px solid rgba(254,44,85,.35);border-radius:18px;
  padding:22px;text-align:center;margin-top:14px;color:#ff8ba0;font-size:14px}
/* ===== result ===== */
.res{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-top:14px;overflow:hidden;
  animation:up .35s ease;box-shadow:0 14px 40px rgba(0,0,0,.4)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.phead{padding:20px 18px 0;text-align:center;position:relative}
.ava{width:108px;height:108px;border-radius:50%;margin:0 auto;position:relative;cursor:pointer;
  background:var(--grad);padding:3px}
.ava img,.ava .af{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--card2)}
.ava .af{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff}
.pname{font-size:21px;font-weight:900;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.vrf{width:20px;height:20px;fill:var(--cyan);flex:0 0 20px}
.uname{color:var(--mut);font-size:14px;margin-top:3px;direction:ltr}
.priv{display:inline-block;margin-top:8px;font-size:12px;padding:4px 12px;border-radius:999px;
  background:rgba(37,244,238,.12);color:var(--cyan);border:1px solid rgba(37,244,238,.3)}
.priv.no{background:rgba(254,44,85,.1);color:#ff8ba0;border-color:rgba(254,44,85,.3)}
.bio{color:#d7d7e0;font-size:14px;line-height:1.8;margin:12px 4px 0;white-space:pre-wrap;word-break:break-word}
.stats{display:flex;margin:18px 0 0;border-top:1px solid var(--line)}
.stat{flex:1;text-align:center;padding:14px 4px}
.stat+.stat{border-right:1px solid var(--line)}
.sn{font-size:19px;font-weight:900}
.sl{font-size:12px;color:var(--mut);margin-top:3px}
/* actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 18px 4px}
.acts .btn{padding:12px 8px;font-size:13.5px}
.acts .full{grid-column:1/-1}
/* insights */
.ins{margin:14px 18px 0;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px}
.ins h4{font-size:13px;color:var(--mut);margin-bottom:10px}
.irow{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0}
.irow b{font-weight:800}
.bar{height:7px;background:#2a2a38;border-radius:99px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
/* details */
.det{padding:6px 18px 18px}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;
  border-bottom:1px solid var(--line);font-size:13.5px}
.drow:last-child{border:none}
.dk{color:var(--mut);display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dv{font-weight:700;text-align:left;word-break:break-word;display:flex;align-items:center;gap:8px}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
  padding:5px 10px;font-size:12px;cursor:pointer;font-weight:700}
.mini:active{transform:scale(.94)}
.qr{text-align:center;padding:6px 0 18px}
.qr img{border-radius:14px;border:1px solid var(--line);background:#fff;padding:8px;width:150px;height:150px}
.qr p{font-size:12px;color:var(--mut);margin-top:8px}
.lim{display:inline-block;margin-top:10px;font-size:12.5px;padding:6px 14px;border-radius:999px;
  background:rgba(255,180,0,.12);color:#ffcf5c;border:1px solid rgba(255,180,0,.35)}
.note{color:var(--mut);font-size:13px;line-height:1.9;margin:12px 4px 0}
.tt-embed-wrap{padding:6px 18px 0}.tt-embed-wrap blockquote{margin:0 auto !important}
.sec-t{font-size:14px;font-weight:900;margin:16px 18px 4px;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--grad)}
/* footer */
.ftr{text-align:center;color:var(--mut);font-size:12px;margin-top:22px;line-height:2}
/* captcha */
.cover{position:fixed;inset:0;background:rgba(5,5,10,.92);backdrop-filter:blur(8px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 26px;
  width:100%;max-width:330px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cbox .mk{width:60px;height:60px;border-radius:18px;background:var(--grad);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff}
.cbox h2{font-size:20px;margin-bottom:6px}
.cbox p{color:var(--mut);font-size:13px;margin-bottom:16px}
.cmath{font-size:30px;font-weight:900;letter-spacing:2px;margin-bottom:14px;direction:ltr}
.cbox input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--txt);
  padding:13px;font-size:18px;text-align:center;outline:none;margin-bottom:12px}
.cbox input:focus{border-color:var(--pink)}
.cbox .btn{width:100%;padding:14px}
/* modal + toast */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.mov img{max-width:100%;max-height:92vh;border-radius:18px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1f1f2b;border:1px solid var(--line);color:var(--txt);padding:11px 20px;border-radius:999px;
  font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:up .25s}
</style>
</head>
<body>
<div id="toasts"></div>

<div class="cover" id="captchaCover">
  <div class="cbox">
    <div class="mk">R</div>
    <h2>حماية الموقع</h2>
    <p>حل المسألة البسيطة للدخول</p>
    <div class="cmath" id="captchaQ">؟</div>
    <input type="number" id="captchaA" placeholder="الجواب" inputmode="numeric">
    <button class="btn btn-p" onclick="verifyCaptcha()">دخول ✓</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <div class="hdr">
    <div class="logo"><div class="mk">R</div><h1>Rio</h1></div>
    <div class="tag">كاشف حسابات تيك توك • <b>v2.3</b></div>
  </div>

  <div class="search">
    <div class="srow">
      <input id="query" dir="ltr" placeholder="@username" autocomplete="off" enterkeyhint="search">
      <button class="btn btn-g" onclick="pasteQuery()" title="لصق">📋</button>
      <button class="btn btn-p" onclick="doSearch()">بحث</button>
    </div>
    <div class="hint">الصق اسم المستخدم أو رابط الحساب أو رابط الفيديو/المشاركة</div>
    <div id="histWrap" hidden>
      <div class="hist-title"><span>عمليات بحث سابقة</span><button onclick="clearHistory()">مسح الكل</button></div>
      <div class="hist" id="hist"></div>
    </div>
  </div>

  <div class="skel" id="loader" hidden>
    <div style="display:flex;gap:14px;align-items:center">
      <div class="sk" style="width:84px;height:84px;border-radius:50%"></div>
      <div style="flex:1"><div class="sk" style="height:20px;width:60%;margin-bottom:10px"></div><div class="sk" style="height:14px;width:40%"></div></div>
    </div>
    <div class="sk" style="height:60px;margin-top:16px"></div>
    <div class="sk" style="height:120px;margin-top:12px"></div>
  </div>

  <div class="err" id="errBox" hidden>⚠️<div id="errMsg" style="margin-top:8px"></div>
  <button class="btn btn-p" style="margin-top:14px;padding:11px 26px" onclick="doSearch()">🔄 إعادة المحاولة</button></div>

  <section class="res" id="result" hidden></section>

  <div class="ftr">Rio © 2026 • البيانات عامة من تيك توك<br>صُنع بشغف في العراق 🇮🇶</div>
</div>

<div class="mov" id="avaModal" onclick="this.style.display='none'">
  <img id="avaBig" src="" alt="">
</div>

<script>
'use strict';
/* ===== إعداد الخادم الخاص (Cloudflare Worker) =====
   بعد نشر الـ Worker ضع رابطه هنا، وسيصبح المصدر الأساسي للبيانات */
const WORKER_URL = ''; // مثال: 'https://rio-proxy.username.workers.dev'
const WORKER_KEY = 'sm7pg8RRUexMxgNEv7GGNZCwOXQXz-su';
/* حد الطلبات: حماية من الحظر وإساءة الاستخدام */
const RATE_MIN_MS = 3000;
let lastSearchAt = 0;
/* ================= أدوات ================= */
const $=id=>document.getElementById(id);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtN(n){n=+n||0;if(n>=1e9)return (n/1e9).toFixed(1)+'B';if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return ''+n;}
function fmtT(ts){if(!ts)return '—';const d=new Date((+ts)*1000);return isNaN(d)?'—':d.toLocaleDateString('en-GB');}
async function copyTx(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'تم النسخ ✓');}catch(e){const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast(msg||'تم النسخ ✓');}catch(_){toast('تعذر النسخ');}i.remove();}}

/* ================= كابتشا ================= */
let capAns=0;
function newCaptcha(){const a=1+Math.floor(Math.random()*12),b=1+Math.floor(Math.random()*12);capAns=a+b;$('captchaQ').textContent=a+' + '+b+' = ؟';}
function verifyCaptcha(){const v=+$('captchaA').value;if(v===capAns){$('captchaCover').style.display='none';$('app').hidden=false;try{localStorage.setItem('rio_ok','1');}catch(e){}}else{toast('جواب خاطئ، حاول مجدداً');newCaptcha();$('captchaA').value='';}}
try{if(localStorage.getItem('rio_ok')==='1'){$('captchaCover').style.display='none';$('app').hidden=false;}}catch(e){}
newCaptcha();
$('captchaA').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCaptcha();});
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
async function pasteQuery(){try{const t=await navigator.clipboard.readText();if(t){$('query').value=t.trim();doSearch();}}catch(e){toast('الصق يدوياً داخل الحقل');}}

/* ================= السجل ================= */
const HKEY='rio_hist_v2';
function getHist(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return[];}}
function saveHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,12)));}catch(e){}}
function addHist(u,av){let h=getHist().filter(x=>x.u!==u);h.unshift({u,av:av||''});saveHist(h);renderHist();}
function delHist(u){saveHist(getHist().filter(x=>x.u!==u));renderHist();}
function clearHistory(){saveHist([]);renderHist();}
function renderHist(){
  const h=getHist(),w=$('histWrap'),c=$('hist');
  w.hidden=!h.length; c.innerHTML='';
  h.forEach(x=>{
    const d=document.createElement('div');d.className='hchip';
    d.innerHTML=(x.av?`<img src="${esc(x.av)}" onerror="this.remove()">`:'')+`<span dir="ltr">@${esc(x.u)}</span><span class="x">×</span>`;
    d.onclick=()=>{$('query').value='@'+x.u;doSearch();};
    d.querySelector('.x').onclick=e=>{e.stopPropagation();delHist(x.u);};
    c.appendChild(d);
  });
}
renderHist();

/* ================= الجلب ================= */
const PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?'+encodeURIComponent(u)
];
let avatarHD='';
function extractUsername(q){
  q=(q||'').trim(); if(!q)return '';
  let m=q.match(/tiktok\.com\/@([\w.\-]+)/i); if(m)return m[1];
  m=q.match(/vm\.tiktok\.com\/(\w+)/i)||q.match(/vt\.tiktok\.com\/(\w+)/i);
  if(m)return 'SHORT:'+m[1];
  m=q.match(/@([\w.\-]{2,24})/); if(m)return m[1];
  m=q.match(/^([\w.\-]{2,24})$/); if(m)return m[1];
  return '';
}
async function resolveShort(id){
  const url='https://vm.tiktok.com/'+id+'/';
  for(const p of PROXIES){
    try{
      const r=await fetch(p(url),{method:'HEAD',redirect:'follow'});
      const m=(r.url||'').match(/tiktok\.com\/@([\w.\-]+)/i);
      if(m)return m[1];
    }catch(e){}
  }
  throw new Error('تعذر حل الرابط المختصر');
}
async function fetchPage(url){
  let lastErr=null;
  for(const p of PROXIES){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),25000);
      const r=await fetch(p(url),{signal:ctrl.signal}); clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const t=await r.text();
      if(t.length<5000)throw new Error('رد فارغ');
      return t;
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('فشل الاتصال');
}
async function fetchViaWorker(u){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
  const r=await fetch(WORKER_URL+'?u='+encodeURIComponent(u)+'&key='+encodeURIComponent(WORKER_KEY),{signal:ctrl.signal});
  clearTimeout(to);
  if(!r.ok)throw new Error('worker_'+r.status);
  const j=await r.json();
  if(!j.ok||!j.profile)throw new Error(j.error||'worker_parse');
  return normalizeWorker(j.profile);
}
function normalizeWorker(p){
  const set=v=>v===0?'للجميع':(v===1?'للأصدقاء':'معطل');
  const fol=p.followers||0,lik=p.likes||0,vid=p.videos||0;
  const cc=(p.region||'').toUpperCase(),lc=(p.language||'').toLowerCase();
  avatarHD=p.avatar||'';
  return {
    username:p.username,userId:p.userId,name:p.name,bio:p.bio,
    verified:!!p.verified,private:!!p.private,
    followers:fol,following:p.following||0,likes:lik,videos:vid,
    avgLikes:vid?Math.round(lik/vid):0,
    engRate:(fol&&vid)?Math.min(100,(Math.round(lik/vid)/fol*100)):0,
    created:fmtT(p.created),region:countriesMap[cc]||p.region||'غير محدد',
    language:langsMap[lc]||p.language||'غير محدد',
    duet:set(p.duet),comments:set(p.comments),stitch:set(p.stitch),download:set(p.download),
    friends:p.friends||0,commerce:p.commerce?'نعم':'لا',
    device:p.device===1?'آيفون 📱':(p.device===2?'أندرويد 🤖':'غير معروف'),
    via:'worker'
  };
}
async function fetchOEmbed(u){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent('https://www.tiktok.com/@'+u),{signal:ctrl.signal});
    clearTimeout(to);
    if(r.status===404)throw new Error('NOT_FOUND');
    if(!r.ok)throw new Error('فشل الاتصال');
    const j=await r.json();
    if(!j.author_name)throw new Error('NOT_FOUND');
    return {name:j.author_name,username:u,url:j.author_url||('https://www.tiktok.com/@'+u),html:j.html||''};
  }catch(e){clearTimeout(to);throw e;}
}
const countriesMap={IQ:'العراق 🇮🇶',SA:'السعودية 🇸🇦',EG:'مصر 🇪🇬',AE:'الإمارات 🇦🇪',KW:'الكويت 🇰🇼',QA:'قطر 🇶🇦',BH:'البحرين 🇧🇭',OM:'عمان 🇴🇲',JO:'الأردن 🇯🇴',LB:'لبنان 🇱🇧',SY:'سوريا 🇸🇾',YE:'اليمن 🇾🇪',TR:'تركيا 🇹🇷',IR:'إيران 🇮🇷',US:'أمريكا 🇺🇸',GB:'بريطانيا 🇬🇧',DE:'ألمانيا 🇩🇪',FR:'فرنسا 🇫🇷',CA:'كندا 🇨🇦',AU:'أستراليا 🇦🇺',IN:'الهند 🇮🇳',PK:'باكستان 🇵🇰',PH:'الفلبين 🇵🇭',ID:'إندونيسيا 🇮🇩',MY:'ماليزيا 🇲🇾',RU:'روسيا 🇷🇺',UA:'أوكرانيا 🇺🇦',BR:'البرازيل 🇧🇷',ES:'إسبانيا 🇪🇸',IT:'إيطاليا 🇮🇹',NL:'هولندا 🇳🇱',SE:'السويد 🇸🇪',KR:'كوريا 🇰🇷',JP:'اليابان 🇯🇵',CN:'الصين 🇨🇳'};
const langsMap={ar:'العربية',en:'الإنجليزية',fr:'الفرنسية',es:'الإسبانية',tr:'التركية',de:'الألمانية',ru:'الروسية',fa:'الفارسية',ur:'الأردية',hi:'الهندية',ku:'الكردية'};
function parseProfile(html){
  const m=html.match(/<script id="__UNIVERSAL_DATA_FOR_REHYDRATION__"[^>]*>(.*?)<\/script>/);
  if(!m)throw new Error('الحساب غير موجود أو خاص');
  const j=JSON.parse(m[1]);
  const det=j.__DEFAULT_SCOPE__&&j.__DEFAULT_SCOPE__['webapp.user-detail'];
  if(!det||!det.userInfo)throw new Error('تعذر استخراج البيانات');
  const u=det.userInfo.user,s=det.userInfo.stats;
  const cc=((u.region||u.country||'').toUpperCase()),lc=((u.language||u.lang||'').toLowerCase());
  avatarHD=u.avatarLarger||u.avatarMedium||u.avatarThumb||'';
  const fol=s.followerCount||0,lik=s.heartCount||s.diggCount||0,vid=s.videoCount||0;
  return {
    username:u.uniqueId,userId:u.id||u.uid,name:u.nickname||u.uniqueId,bio:u.signature||'',
    verified:!!u.verified,private:!!u.privateAccount,
    followers:fol,following:s.followingCount||0,likes:lik,videos:vid,
    avgLikes:vid?Math.round(lik/vid):0,
    engRate:(fol&&vid)?Math.min(100,(Math.round(lik/vid)/fol*100)):0,
    created:fmtT(u.createTime),region:countriesMap[cc]||u.region||'غير محدد',
    language:langsMap[lc]||u.language||'غير محدد',
    duet:u.duetSetting===0?'للجميع':(u.duetSetting===1?'للأصدقاء':'معطل'),
    comments:u.commentSetting===0?'للجميع':(u.commentSetting===1?'للأصدقاء':'معطل'),
    stitch:u.stitchSetting===0?'للجميع':(u.stitchSetting===1?'للأصدقاء':'معطل'),
    download:u.downloadSetting===0?'للجميع':(u.downloadSetting===1?'للأصدقاء':'معطل'),
    friends:s.friendCount||0,
    commerce:(u.commerceUserInfo&&u.commerceUserInfo.commerceUser)?('نعم'+(u.commerceUserInfo.category?(' • '+u.commerceUserInfo.category):'')):'لا',
    device:u.deviceType===1?'آيفون 📱':(u.deviceType===2?'أندرويد 🤖':'غير معروف')
  };
}

/* ================= العرض ================= */
let lastData=null;
function renderProfile(d){
  lastData=d;
  const v=d.verified?'<svg class="vrf" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#25f4ee"/><path d="M10.6 15.6l-3.2-3.2 1.4-1.4 1.8 1.8 4.6-4.6 1.4 1.4z" fill="#0b0b10"/></svg>':'';
  const av=d.username?('https://www.tiktok.com/@'+d.username):'';
  const initials=esc((d.name||d.username||'?').trim().charAt(0));
  const ava=avatarHD
    ?`<img src="${esc(avatarHD)}" alt="" onerror="this.outerHTML='<span class=af>${initials}</span>'">`
    :`<span class="af">${initials}</span>`;
  const bio=d.bio?`<div class="bio">${esc(d.bio).slice(0,300)}</div>`:'';
  const eng=Math.round(d.engRate*10)/10;
  $('result').innerHTML=`
  <div class="phead">
    <div class="ava" onclick="showAvatar()">${ava}</div>
    <div class="pname">${esc(d.name)} ${v}</div>
    <div class="uname">@${esc(d.username)}</div>
    <span class="priv ${d.private?'no':''}">${d.private?'🔒 حساب خاص':'🌍 حساب عام'}</span>
    ${bio}
  </div>
  <div class="stats">
    <div class="stat"><div class="sn">${fmtN(d.followers)}</div><div class="sl">متابع</div></div>
    <div class="stat"><div class="sn">${fmtN(d.following)}</div><div class="sl">يتابع</div></div>
    <div class="stat"><div class="sn">${fmtN(d.likes)}</div><div class="sl">إعجاب</div></div>
    <div class="stat"><div class="sn">${fmtN(d.videos)}</div><div class="sl">فيديو</div></div>
  </div>
  <div class="acts">
    <button class="btn btn-p full" onclick="openTikTok()">فتح في تيك توك ↗</button>
    <button class="btn btn-g" onclick="dlAvatar()">⬇ الصورة</button>
    <button class="btn btn-g" onclick="copyLink()">🔗 نسخ الرابط</button>
    <button class="btn btn-g" onclick="copyInfo()">📋 نسخ المعلومات</button>
    <button class="btn btn-g" onclick="shareMe()">📤 مشاركة</button>
  </div>
  <div class="sec-t">تحليل سريع</div>
  <div class="ins">
    <div class="irow"><span>متوسط الإعجابات / فيديو</span><b>${fmtN(d.avgLikes)}</b></div>
    <div class="irow"><span>معدل التفاعل (تقديري)</span><b>${eng}%</b></div>
    <div class="bar"><i style="width:${Math.min(100,eng)}%"></i></div>
  </div>
  <div class="sec-t">تفاصيل الحساب</div>
  <div class="det">
    <div class="drow"><span class="dk">🆔 المعرف</span><span class="dv"><span dir="ltr">${esc(d.userId)}</span><button class="mini" onclick="copyTx('${esc(d.userId)}','تم نسخ المعرف')">نسخ</button></span></div>
    <div class="drow"><span class="dk">📍 المنطقة</span><span class="dv">${esc(d.region)}</span></div>
    <div class="drow"><span class="dk">🌐 اللغة</span><span class="dv">${esc(d.language)}</span></div>
    <div class="drow"><span class="dk">📱 الجهاز</span><span class="dv">${esc(d.device)}</span></div>
    <div class="drow"><span class="dk">💬 التعليقات</span><span class="dv">${esc(d.comments)}</span></div>
    <div class="drow"><span class="dk">🎭 الدويتو</span><span class="dv">${esc(d.duet)}</span></div>
    <div class="drow"><span class="dk">✂️ الستيتش</span><span class="dv">${esc(d.stitch)}</span></div>
    <div class="drow"><span class="dk">⬇️ تحميل الفيديوهات</span><span class="dv">${esc(d.download)}</span></div>
    <div class="drow"><span class="dk">🤝 الأصدقاء</span><span class="dv">${fmtN(d.friends)}</span></div>
    <div class="drow"><span class="dk">🏪 حساب تجاري</span><span class="dv">${esc(d.commerce)}</span></div>
    <div class="drow"><span class="dk">📅 إنشاء الحساب</span><span class="dv">${esc(d.created)}</span></div>
  </div>
  <div class="qr">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(av)}" alt="QR" loading="lazy">
    <p>امسح للفتح في تيك توك</p>
  </div>`;
  $('result').hidden=false;
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderLimited(o){
  // بطاقة فورية من oEmbed + تضمين تيك توك الرسمي، ثم ترقية تلقائية بالبيانات الكاملة
  lastData={username:o.username,name:o.name,limited:true};
  avatarHD='';
  const url='https://www.tiktok.com/@'+o.username;
  const embed=o.html?`<div class="tt-embed-wrap">${o.html}</div>`:'';
  $('result').innerHTML=`
  <div class="phead">
    <div class="pname">${esc(o.name)}</div>
    <div class="uname">@${esc(o.username)}</div>
    <span class="lim" id="limBadge">⚡ جاري جلب التفاصيل...</span>
  </div>
  ${embed}
  <div class="acts">
    <button class="btn btn-p full" onclick="openTikTok()">فتح في تيك توك ↗</button>
    <button class="btn btn-g" onclick="copyLink()">🔗 نسخ الرابط</button>
    <button class="btn btn-g" onclick="shareMe()">📤 مشاركة</button>
  </div>
  <div class="qr">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}" alt="QR" loading="lazy">
    <p>امسح للفتح في تيك توك</p>
  </div>`;
  $('result').hidden=false;
  // تشغيل تضمين تيك توك الرسمي (يعرض الصورة والفيديوهات من تيك توك مباشرة)
  try{
    const s=document.createElement('script');
    s.src='https://www.tiktok.com/embed.js';
    s.async=true;
    document.body.appendChild(s);
  }catch(e){}
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
  // محاولة الترقية للبيانات الكاملة في الخلفية
  tryFullData(o.username);
}
async function tryFullData(u){
  try{
    let d;
    if(WORKER_URL){d=await fetchViaWorker(u);}
    else{const html=await fetchPage('https://www.tiktok.com/@'+u);d=parseProfile(html);}
    addHist(d.username,avatarHD);
    renderProfile(d);
    toast('تم جلب التفاصيل الكاملة ✓');
  }catch(e){
    const b=$('limBadge');
    if(b)b.textContent='⚡ وضع سريع — تعذر جلب الإحصائيات حالياً';
  }
}
function showAvatar(){if(!avatarHD)return;$('avaBig').src=avatarHD;$('avaModal').style.display='flex';}
function openTikTok(){if(lastData)window.open('https://www.tiktok.com/@'+lastData.username,'_blank');}
function copyLink(){if(lastData)copyTx('https://www.tiktok.com/@'+lastData.username,'تم نسخ الرابط ✓');}
function copyInfo(){
  if(!lastData)return;const d=lastData;
  copyTx(`👤 ${d.name} (@${d.username})${d.verified?' ✓':''}\n👥 متابعين: ${fmtN(d.followers)} | يتابع: ${fmtN(d.following)}\n❤️ إعجابات: ${fmtN(d.likes)} | 🎬 فيديوهات: ${fmtN(d.videos)}\n🆔 ${d.userId}\n📍 ${d.region}\n🔗 https://www.tiktok.com/@${d.username}`,'تم نسخ المعلومات ✓');
}
async function shareMe(){
  if(!lastData)return;
  const url='https://www.tiktok.com/@'+lastData.username;
  if(navigator.share){try{await navigator.share({title:lastData.name,url});}catch(e){}}
  else copyLink();
}
async function dlAvatar(){
  if(!avatarHD){toast('لا توجد صورة');return;}
  toast('جاري التحميل...');
  try{
    let r=await fetch(avatarHD);
    if(!r.ok)throw 0;
    const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=(lastData?lastData.username:'avatar')+'.jpg';a.click();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  }catch(e){
    try{
      const r2=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(avatarHD));
      const b=await r2.blob(),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=(lastData?lastData.username:'avatar')+'.jpg';a.click();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
    }catch(_){window.open(avatarHD,'_blank');}
  }
}

/* ================= البحث ================= */
async function doSearch(forceFull){
  const now=Date.now();
  if(now-lastSearchAt<RATE_MIN_MS&&!forceFull){toast('انتظر ثوانٍ بين كل بحث');return;}
  lastSearchAt=now;
  const q=$('query').value;hideAll();
  let u=extractUsername(q);
  if(!u){showErr('اكتب اسم مستخدم صحيح مثل @rio');return;}
  if(u.startsWith('SHORT:')){
    toast('جاري حل الرابط...');
    try{u=await resolveShort(u.slice(6));}catch(e){showErr(e.message);return;}
  }
  $('loader').hidden=false;
  try{
    // أولاً: oEmbed المباشر (سريع ومضمون) — يعرض البطاقة فوراً
    const o=await fetchOEmbed(u);
    addHist(o.username,'');
    $('loader').hidden=true;
    renderLimited(o); // بداخلها تتم الترقية للبيانات الكاملة تلقائياً
  }catch(e){
    $('loader').hidden=true;
    showErr(e.message==='NOT_FOUND'?'الحساب غير موجود — تأكد من الاسم':'تعذر الاتصال — تحقق من الإنترنت وحاول مجدداً');
  }
}
function hideAll(){$('result').hidden=true;$('errBox').hidden=true;}
function showErr(m){$('errMsg').textContent=m;$('errBox').hidden=false;}
</script>
